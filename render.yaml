services:
  - type: web
    name: contatos-lukas-pio
    runtime: node
    region: ohio
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_URL
        fromDatabase:
          name: contatos-db
          property: connectionString

databases:
  - name: contatos-db
    region: ohio
    plan: free
    databaseName: contatos
    user: contatos_app
    ipAllowList: []
